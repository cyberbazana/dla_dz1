defaults:
  - model: conformer
  - decoder: greedy
  - metrics: ctc
  - datasets: librispeech_eval
  - dataloader: batch_2
  - transforms: noaug
  - _self_

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

inferencer:
  device_tensors: ["spectrogram"]
  device: "cuda:0"
  save_path: "TEST"
  seed: 1
  from_pretrained: "baseline/testing/checkpoint-epoch30.pth"
