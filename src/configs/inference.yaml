defaults:
  - model: conformer
  - decoder: greedy
  - metrics: ctc
  - datasets: librispeech_eval
  - dataloader: batch_2
  - transforms: noaug
  - _self_


text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

inferencer:
  device_tensors: ["spectogram"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "TEST" # any name here, can be a dataset name
  seed: 1
  from_pretrained: null
