defaults:
  - model: conformer_d_model_256
  - decoder: lm_beam
  - metrics: ctc
  - datasets: librispeech_eval
  - dataloader: batch_2
  - transforms: noaug
  - writer: null
  - _self_

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

inferencer:
  device_tensors: ["spectrogram"]
  device: "cuda:0"
  save_path: "TEST"
  seed: 1
  from_pretrained: "saved/greedy+aug_ver_article/model_best.pth"
