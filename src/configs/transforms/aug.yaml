instance_transforms:
  train:
    audio_aug:
      _target_: torch.nn.Sequential
      _args_:
        - _target_: src.transforms.wav_augs.gain.Gain
          min_gain_in_db: -6.0
          max_gain_in_db: 6.0
          p: 0.4
        - _target_: src.transforms.wav_augs.add_noise.AddNoise
          min_snr_in_db: 5.0
          max_snr_in_db: 20.0
          p: 0.4

        - _target_: src.transforms.wav_augs.speed_change.SpeedChanger
          sample_rate: 16000
          speeds: [0.9, 1.0, 1.1]
          p: 0.3

    get_spectrogram:
      _target_: src.transforms.Spectrogram
      sample_rate: 16000
      n_fft: 512
      win_length: 400
      hop_length: 160
      n_mels: 80
      f_min: 0.0
      f_max: null

    spectrogram:
      _target_: torch.nn.Sequential
      _args_:
        - _target_: src.transforms.spec_augs.freq_corrupt.FreqCorrupt
          freq_mask_param: 5
          num_masks: 10
          p: 0.50
        - _target_: src.transforms.spec_augs.time_corrupt.TimeCorrupt
          num_masks: 10
          p: 0.5

  inference:
    get_spectrogram:
      _target_: src.transforms.Spectrogram
      sample_rate: 16000
      n_fft: 512
      win_length: 400
      hop_length: 160
      n_mels: 80
      f_min: 0.0
      f_max: null

batch_transforms:
  train: null
  inference: null
